<!DOCTYPE html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>WebLinux OS</title>
<style>

.di{width:78px;min-height:0;padding:6px 2px;background:none;border:1px solid transparent;color:#fff;text-shadow:0 1px 3px #000;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.di.sel{background:rgba(61,174,233,.3);border-color:var(--ac)}
.ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:24px;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.w{position:absolute;display:flex;flex-direction:column;background:var(--win);border:1px solid var(--bd);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.4);overflow:hidden;resize:both;min-width:240px;min-height:150px;max-width:100%;max-height:100%}

.tb{display:flex;align-items:center;gap:2px;padding:0 4px 0 10px;height:38px;background:var(--sf);touch-action:none;user-select:none;flex:none}

.act .tb{box-shadow:inset 0 -2px var(--ac)}.wb{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}

#pnl button{background:none;border:0;color:inherit}
.pb{width:44px;height:40px;display:grid;place-items:center;position:relative;border-radius:8px;padding:0;font-size:18px}.pb:hover{background:rgba(255,255,255,.12)}
.pb .ic{width:30px;height:30px;font-size:17px;border-radius:8px}
.pb.run::after{content:"";position:absolute;bottom:2px;width:14px;height:3px;border-radius:2px;background:#8a9097}.pb.act::after{background:var(--ac);width:22px}.pb.mn .ic{opacity:.45}
#mid{flex:1;display:flex;justify-content:center;gap:2px;overflow-x:auto;min-width:0}#tray{display:flex;align-items:center;gap:2px}
#clk{text-align:center;line-height:1.15;font-size:12px;padding:0 8px;white-space:nowrap}#clk b{display:block;font-size:13px}
.bd{position:absolute;top:2px;right:2px;min-width:15px;height:15px;border-radius:8px;background:#da4453;font-size:10px;line-height:15px;color:#fff}
#pop{position:fixed;bottom:calc(var(--ph) + env(safe-area-inset-bottom,0px) + 6px);width:min(340px,calc(100% - 12px));max-height:calc(100% - var(--ph) - 90px);overflow:auto;background:var(--win);color:var(--fg);border:1px solid var(--bd);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.45);padding:8px;z-index:100001}
#pop.L{left:6px}#pop.R{right:6px}#pop[hidden]{display:none}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.li{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;text-align:start;border:0;background:none;border-radius:6px;padding:4px 6px}.li:hover{background:rgba(61,174,233,.22)}
.li .ic{width:28px;height:28px;font-size:15px;border-radius:8px;flex:none;box-shadow:none}

:root[data-theme="light"] .cd{--cb:#fff;--cf:#1f1f1f;--sg:#f3f3f3;--bg:#e4e4e4;--gn:#237893;--tc:#008000;--ts:#a31515;--tn:#098658;--tk:#0000ff;--tf:#795e26}

.cm{flex:1;display:flex;min-height:0;position:relative}.ab{width:44px;background:var(--bg);display:flex;flex-direction:column;align-items:center;flex:none}.ab button{width:44px;height:44px;font-size:18px}

.ma{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}.tbs{display:flex;overflow-x:auto;background:var(--sg);flex:none;min-height:34px}

.ed2{flex:1;display:flex;min-height:0}.gt{padding:8px 8px 28px 6px;text-align:right;color:var(--gn);overflow:hidden;user-select:none;min-width:40px}.stk{flex:1;position:relative;min-width:0}
.gt,.hl,.ta{font:13px/20px ui-monospace,Menlo,Consolas,"DejaVu Sans Mono",monospace;letter-spacing:0;tab-size:2;white-space:pre}
.hl,.ta{position:absolute;inset:0;margin:0;padding:8px 8px 28px;border:0;border-radius:0;background:transparent;overflow:auto}.hl{overflow:hidden;pointer-events:none;color:var(--cf)}
.ta{color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--cf);resize:none;outline:0}.ta::selection{background:rgba(38,120,200,.45)}
.hl i{font-style:normal}.hl .c{color:var(--tc)}.hl .s{color:var(--ts)}.hl .n{color:var(--tn)}.hl .k{color:var(--tk)}.hl .f{color:var(--tf)}
.st{display:flex;justify-content:space-between;gap:8px;padding:2px 10px;background:#007acc;color:#fff;font-size:12px;flex:none;white-space:pre;overflow:hidden}
.tp{height:38%;min-height:120px;display:flex;flex-direction:column;border-top:1px solid var(--bg);flex:none}

.pal{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:min(520px,94%);background:var(--sg);border:1px solid var(--bg);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.5);padding:6px;z-index:5}.pal input{width:100%;background:var(--cb);color:var(--cf)}.pl{max-height:240px;overflow:auto}
@container (max-width:600px){.sb{position:absolute;left:44px;top:0;bottom:0;z-index:3;box-shadow:4px 0 14px rgba(0,0,0,.4)}}
@media(pointer:fine){.xk{display:none}}
@media(max-width:480px){.pb{width:36px}#clk{padding:0 4px}.dt{display:none}#pnl{gap:2px;padding-inline:4px}}

const DEF={theme:'dark',lang:'en',ac:'#3daee9',wp:0,h24:true,icons:true,snd:true,vol:70,pins:['files','code','editor','term','settings']};
let cfg;try{cfg={...DEF,...JSON.parse(localStorage.getItem('wl.cfg')||'{}')}}catch{cfg={...DEF}}
if(Array.isArray(cfg.pins)&&!cfg.pins.includes('code'))cfg.pins.splice(1,0,'code');
const t=(k,v)=>String((T[cfg.lang]||T.en)[k]??T.en[k]??k).replace('{x}',v??'');
const saveCfg=()=>{try{localStorage.setItem('wl.cfg',JSON.stringify(cfg))}catch{note(t('err'))}};
const WP=['linear-gradient(135deg,#1d3557,#3d5a80 50%,#0f6e8a)','linear-gradient(160deg,#2b1055,#7597de)','linear-gradient(150deg,#134e4a,#65a30d)','linear-gradient(135deg,#434343,#101214)'];

const V=(()=>{let db=null;const M=new Map();

const sane=c=>{const o={};if(c.theme==='light'||c.theme==='dark')o.theme=c.theme;if(c.lang==='en'||c.lang==='ar')o.lang=c.lang;if(/^#[0-9a-f]{6}$/i.test(c.ac))o.ac=c.ac;if(Number.isInteger(c.wp)&&WP[c.wp])o.wp=c.wp;if(typeof c.h24==='boolean')o.h24=c.h24;if(typeof c.icons==='boolean')o.icons=c.icons;return o};
const restore=async()=>{const s=await ask(t('rsh'),{ta:1,val:''});if(!s)return;try{const[n,k,c]=await V.restore(s);if(c&&typeof c==='object')set(sane(c));note(t('rsd',n+' / '+k))}catch{note(t('bad'))}wins.forEach(x=>x.api.refresh?.())};
const reset=async()=>{if(await ask(t('rsq'),{ok:t('reset')}))set({...DEF,pins:[...DEF.pins]})};
const erase=async()=>{if(await ask(t('erq'),{ok:t('erase')})){await V.clear();wins.forEach(x=>x.api.refresh?.())}};
async function draw(){const u=await V.usage();pg.replaceChildren(
grp(t('theme'),...['light','dark'].map(k=>h('button',{class:cfg.theme===k?'on':'',onclick:()=>set({theme:k})},t(k)))),
grp(t('accent'),...AC.map(c=>sw(c,cfg.ac===c,()=>set({ac:c}),c))),grp(t('wall'),...WP.map((g,i)=>sw(g,cfg.wp===i,()=>set({wp:i}),t('wall')+' '+(i+1)))),
grp(t('lang'),h('button',{class:cfg.lang==='en'?'on':'',onclick:()=>set({lang:'en'})},'English'),h('button',{class:cfg.lang==='ar'?'on':'',onclick:()=>set({lang:'ar'})},'العربية')),
grp(t('misc'),h('button',{class:cfg.h24?'on':'',onclick:()=>set({h24:!cfg.h24})},t('h24')),h('button',{class:cfg.icons?'on':'',onclick:()=>set({icons:!cfg.icons})},t('dicons'))),
grp(t('snd'),sndCtl()),
grp(t('stor'),h('span',{},fmt(u.n)+(u.q&&u.q.quota?' / '+fmt(u.q.quota):'')),h('p',{},t('snote'))),
grp(t('bk'),h('button',{onclick:()=>ask(t('bkn'),{ta:1,val:V.dump()})},t('exp')),h('button',{onclick:restore},t('rs')),h('p',{},t('bkn'))),
grp(t('zone'),h('button',{onclick:reset},t('reset')),h('button',{onclick:erase},t('erase'))))}
draw();return{refresh:draw}}

$('#lb').append(ic({g:'🐧',c:'#3daee9'}));$('#lb').onclick=()=>popup('l',launcher,'L');$('#net').onclick=()=>popup('q',quick,'R');$('#vol').onclick=()=>popup('v',()=>h('div',{style:'display:grid;gap:8px'},sndCtl()),'R');$('#bell').onclick=()=>popup('n',notif,'R');
addEventListener('online',netUp);addEventListener('offline',netUp);
try{navigator.getBattery?.().then(b=>{const u=()=>bat=Math.round(b.level*100)+'%';u();b.addEventListener('levelchange',u)}).catch(()=>{})}catch{}
(function tick(){clock();setTimeout(tick,60500-Date.now()%60000)})();
apply();V.init().then(()=>{wins.forEach(x=>x.api.refresh?.());note(t('snote'))});
</script></body></html>
